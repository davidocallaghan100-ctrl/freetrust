openapi: 3.1.0
info:
  title: FreeTrust Read-only Listings API
  version: 1.0.0
  summary: Read public active FreeTrust products and services.
  description: >-
    Phase 1 is read-only and limited to listings:read. It exposes a curated
    projection of active public product and service listings. It does not
    expose private member data, precise/free-form location fields, transactions,
    orders, payments, or listing write operations.
servers:
  - url: https://freetrust.co
    description: FreeTrust production origin
security:
  - DeveloperBearer: []
tags:
  - name: Listings
    description: Read active public products and services.
paths:
  /api/v1/listings:
    get:
      operationId: listListings
      summary: List active public products or services
      description: Returns newest active public listings first, with stable ordering for ties.
      tags: [Listings]
      parameters:
        - name: type
          in: query
          required: true
          description: Listing type to return.
          schema:
            type: string
            enum: [product, service]
        - name: page
          in: query
          required: false
          description: One-based page number.
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 1
        - name: per_page
          in: query
          required: false
          description: Results per page.
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: category
          in: query
          required: false
          description: Exact category match; 80 characters maximum.
          schema:
            type: string
            maxLength: 80
      responses:
        '200':
          description: Paginated public listings.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-RateLimit-Limit-Minute:
              $ref: '#/components/headers/MinuteLimit'
            X-RateLimit-Remaining-Minute:
              $ref: '#/components/headers/MinuteRemaining'
            X-RateLimit-Limit-Day:
              $ref: '#/components/headers/DayLimit'
            X-RateLimit-Remaining-Day:
              $ref: '#/components/headers/DayRemaining'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListingsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/listings/{id}:
    get:
      operationId: getListing
      summary: Retrieve one active public listing
      tags: [Listings]
      parameters:
        - name: id
          in: path
          required: true
          description: UUID of an active public listing.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Public listing detail.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-RateLimit-Limit-Minute:
              $ref: '#/components/headers/MinuteLimit'
            X-RateLimit-Remaining-Minute:
              $ref: '#/components/headers/MinuteRemaining'
            X-RateLimit-Limit-Day:
              $ref: '#/components/headers/DayLimit'
            X-RateLimit-Remaining-Day:
              $ref: '#/components/headers/DayRemaining'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListingResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/Unavailable'
components:
  securitySchemes:
    DeveloperBearer:
      type: http
      scheme: bearer
      bearerFormat: FreeTrust developer API key (ft_live_...)
      description: >-
        Send the secret as Authorization: Bearer <key>. Keep it server-side.
        The only Phase 1 scope is listings:read.
  headers:
    RequestId:
      description: Unique request identifier for support and tracing.
      schema: { type: string, format: uuid }
    MinuteLimit:
      description: Configured per-key requests per minute.
      schema: { type: integer }
    MinuteRemaining:
      description: Remaining per-key requests in the current minute window.
      schema: { type: integer }
    DayLimit:
      description: Configured per-key requests per UTC day.
      schema: { type: integer }
    DayRemaining:
      description: Remaining per-key requests in the current UTC day window.
      schema: { type: integer }
  responses:
    BadRequest:
      description: Invalid query parameters.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: Missing, invalid, expired, or revoked bearer key.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: API key does not have the listings:read scope.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: No active public listing matches the requested ID.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    RateLimited:
      description: Per-key quota or app-wide IP abuse limit exceeded.
      headers:
        Retry-After:
          description: Seconds before retrying (present for per-key quota responses).
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ServerError:
      description: Temporary failure while retrieving public listings.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unavailable:
      description: Developer API quota configuration or backing service is unavailable.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error: { type: string }
        requestId: { type: string, format: uuid }
    ListingsResponse:
      type: object
      required: [data, meta, requestId]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Listing' }
        meta:
          type: object
          required: [type, page, perPage, total, hasMore]
          properties:
            type: { type: string, enum: [product, service] }
            page: { type: integer, minimum: 1 }
            perPage: { type: integer, minimum: 1, maximum: 50 }
            total: { type: integer, minimum: 0 }
            hasMore: { type: boolean }
        requestId: { type: string, format: uuid }
    ListingResponse:
      type: object
      required: [data, requestId]
      properties:
        data: { $ref: '#/components/schemas/Listing' }
        requestId: { type: string, format: uuid }
    Listing:
      type: object
      required: [id, type, title, description, price, imageUrl, category, location, service, rating, publishedAt, seller]
      properties:
        id: { type: [string, 'null'], format: uuid }
        type: { type: string, enum: [product, service] }
        title: { type: [string, 'null'] }
        description: { type: [string, 'null'] }
        price:
          type: object
          required: [amount, currency]
          properties:
            amount: { type: [string, 'null'], description: Decimal amount represented as a string to avoid floating point loss. }
            currency: { type: [string, 'null'] }
        imageUrl: { type: [string, 'null'], format: uri }
        category: { type: [string, 'null'] }
        location:
          type: object
          required: [label, city, region, country, remote]
          properties:
            label: { type: [string, 'null'], description: Coarse location label assembled from city, region, and country; free-form location fields are omitted. }
            city: { type: [string, 'null'] }
            region: { type: [string, 'null'] }
            country: { type: [string, 'null'] }
            remote: { type: boolean }
        service:
          oneOf:
            - type: 'null'
            - type: object
              required: [mode, tags]
              properties:
                mode: { type: [string, 'null'] }
                tags:
                  type: array
                  items: { type: string }
        rating:
          oneOf:
            - type: 'null'
            - type: object
              required: [average, count]
              properties:
                average: { type: number }
                count: { type: number }
        publishedAt: { type: [string, 'null'], format: date-time }
        seller:
          oneOf:
            - type: 'null'
            - type: object
              required: [name, avatarUrl]
              properties:
                name: { type: [string, 'null'] }
                avatarUrl: { type: [string, 'null'], format: uri }
